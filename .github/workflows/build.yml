name: Build

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "project.yml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 构建 iOS App（未签名 ipa）
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 缓存 Homebrew 下载（加速 xcodegen 安装）
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-xcodegen-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-xcodegen-

      - name: 安装 XcodeGen
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install xcodegen

      # xcodegen 2.46+ 生成的工程是 Xcode 16 格式（objectVersion 77），
      # macos-14 默认的 Xcode 15.4 读不了，需显式切换到镜像内预装的 Xcode 16。
      - name: 选择 Xcode 16
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "未找到 Xcode 16，回退到系统默认 Xcode"
          else
            echo "选用 Xcode: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          swift --version

      - name: 生成 Xcode 工程
        run: |
          set -o pipefail
          if ls -d /Applications/Xcode_16*.app >/dev/null 2>&1; then
            xcodegen generate
          else
            echo "未找到 Xcode 16，改用 xcodegen 2.44.1 生成旧格式工程"
            curl -fsSL -o /tmp/xcodegen.zip \
              https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
            unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen-bin
            /tmp/xcodegen-bin/xcodegen/bin/xcodegen generate
          fi

      # 当前工程零第三方 SPM 依赖；此处缓存为后续引入 SwiftPM 依赖预留
      - name: 缓存 SwiftPM 依赖（预留）
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # 用 archive 出 .xcarchive，再手工组 .ipa（未签名）。
      # 不签名无法直接装到真机，但可作为构建产物分发 / 验证编译完整性。
      - name: 归档（Debug，generic/platform=iOS，未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project FeSuiApp.xcodeproj \
            -scheme FeSuiApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FeSuiApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 打包为 ipa
        id: package
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/FeSuiApp.xcarchive/Products/Applications/FeSuiApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::归档产物中找不到 FeSuiApp.app"
            ls -R "$RUNNER_TEMP/FeSuiApp.xcarchive/Products" || true
            exit 1
          fi
          PAYLOAD="$RUNNER_TEMP/Payload"
          rm -rf "$PAYLOAD" && mkdir -p "$PAYLOAD"
          cp -R "$APP_PATH" "$PAYLOAD/"
          cd "$RUNNER_TEMP"
          zip -qry FeSuiApp-unsigned.ipa Payload
          ls -lh FeSuiApp-unsigned.ipa
          echo "ipa_path=$RUNNER_TEMP/FeSuiApp-unsigned.ipa" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FeSuiApp-ipa-${{ github.sha }}
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 30

      - name: 上传 xcarchive（排查用）
        uses: actions/upload-artifact@v4
        with:
          name: FeSuiApp-xcarchive-${{ github.sha }}
          path: ${{ runner.temp }}/FeSuiApp.xcarchive
          if-no-files-found: warn
          retention-days: 7
