name: FeSuiApp
options:
  # 生成中间组（Groups），目录结构在 Xcode 中清晰可见
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
targets:
  FeSuiApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/FeSuiApp
    # 使用仓库内显式 Info.plist（而非 XcodeGen 自动生成）
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gay.fesui.adapp
        PRODUCT_NAME: FeSuiApp
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # CI 以 CODE_SIGNING_ALLOWED=NO 做未签名构建；本地打开时按需选择签名团队
        CODE_SIGN_STYLE: Automatic
